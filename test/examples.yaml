documents:
  - 今天天气真好呀！让我们一起出去玩吧。
  - 若前方无路，我便踏出一条路；若天理不容，我便逆转这乾坤。
  # - 五年前那个深秋的黄昏，我独自站在地坛的古柏下，听见风穿过荒草与断墙，仿佛时光碎裂的声音。母亲曾在这里寻过我无数次，而她的脚印早已被落叶掩埋，只剩下我与这园子互相望着，像两个被遗弃的孩子。
  # - 曲曲折折的荷塘上面，弥望的是田田的叶子。叶子出水很高，像亭亭的舞女的裙。层层的叶子中间，零星地点缀着些白花，有袅娜地开着的，有羞涩地打着朵儿的；正如一粒粒的明珠，又如碧天里的星星，又如刚出浴的美人。
  # - 《午夜镜像》电梯在13楼停下时，显示屏分明跳动着"12"。走廊尽头的古董穿衣镜是房东特意叮嘱不能挪动的，此刻镜面却浮着层水雾，把月光滤成尸斑似的青灰。我第37次擦去雾气时，掌纹突然在镜中扭曲成陌生纹路。镜框雕花的藤蔓缠住手腕刹那，整栋楼的声控灯同时爆裂。黑暗中，镜里的我扬起嘴角，而真正的我正死死咬住嘴唇。保安第二天发现镜子碎成蛛网状，每块碎片都映着不同时间的我：03:15惊恐后退，03:17脖颈后仰成诡异角度，03:19的碎片却空无一人。监控显示我整夜都紧贴镜面站立，指尖在玻璃上重复书写着1937年的日期。如今租客们总抱怨13楼有面擦不干净的镜子。偶尔有醉鬼看见穿真丝睡裙的女人在镜前梳头，发梢滴落的不知是水还是血——那件染血的睡裙，此刻正整整齐齐叠在我的衣柜底层。
  # - 《404病房》护士站的值班表上并没有404号病房。但凌晨三点，我分明听见走廊尽头传来规律的滴水声。白大褂被冷汗浸透时，我握着手电推开了那扇漆皮剥落的铁门。生锈的轮椅在月光下空转，霉味里混着福尔马林之外的腥甜。镜面碎裂的洗手池滴答作响，每声都精准卡在心跳间隙。当我打开最里侧的储物柜，整排玻璃药瓶突然同时炸裂，飞溅的碎片却在半空诡异地凝滞成某种符号。镜中倒影忽然眨了眨眼——那不是我。苍白的手指从背后缠上脖颈时，我听见病历卡散落的声音。最后一张泛黄的纸片上，二十年前的潦草笔迹写着我的名字，诊断栏里爬满黑虫般的字迹：该患者坚称在404病房工作。晨光刺破窗棂时，巡逻保安在废弃仓库发现了十三支空镇静剂。监控录像里，我整夜都坐在布满灰尘的镜子前，对着空气微笑。

